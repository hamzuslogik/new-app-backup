<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/ico/logo.ico" />
    <link rel="apple-touch-icon" href="/logo/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <script>
      (function () {
        var path = window.location.pathname || '';
        var isLogin = path === '/login' || path.endsWith('/login');
        if (isLogin) {
          document.documentElement.classList.add('login-page');
        } else {
          document.documentElement.dataset.desktopViewport = '1400';
        }
      })();
    </script>
    <meta name="description" content="CRM JWS Group - Gestion de la relation client" />
    <title>CRM JWS Group</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
